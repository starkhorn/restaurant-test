<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Display System</title>
    <link rel="stylesheet" href="/css/main.css">
    <style>
        body {
            background-color: var(--dark-bg);
            color: white;
        }
        
        .kitchen-header {
            background: linear-gradient(135deg, var(--warning-color), #e67e22);
            padding: 1rem 0;
            text-align: center;
            box-shadow: var(--shadow);
        }
        
        .kitchen-stats {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin: 1rem 0;
            flex-wrap: wrap;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 1rem;
            border-radius: var(--border-radius);
            text-align: center;
            min-width: 120px;
        }
        
        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: var(--warning-color);
        }
        
        .order-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
            padding: 1rem;
        }
        
        .kitchen-order {
            background: white;
            color: var(--text-dark);
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.3s;
        }
        
        .kitchen-order:hover {
            transform: translateY(-5px);
        }
        
        .kitchen-order.priority {
            border-left: 5px solid var(--danger-color);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(231, 76, 60, 0); }
            100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }
        }
        
        .order-header {
            background: var(--secondary-color);
            color: white;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .order-number {
            font-size: 1.5rem;
            font-weight: bold;
        }
        
        .order-time {
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        .order-items {
            padding: 1rem;
        }
        
        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border-color);
        }
        
        .order-item:last-child {
            border-bottom: none;
        }
        
        .item-info {
            flex: 1;
        }
        
        .item-name {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }
        
        .item-quantity {
            color: var(--text-light);
            font-size: 0.9rem;
        }
        
        .item-special {
            color: var(--warning-color);
            font-size: 0.85rem;
            font-style: italic;
            margin-top: 0.25rem;
        }
        
        .item-controls {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .status-btn {
            padding: 0.25rem 0.75rem;
            border: none;
            border-radius: 15px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 80px;
        }
        
        .status-queued {
            background: #fff3cd;
            color: #856404;
        }
        
        .status-cooking {
            background: #cce5ff;
            color: #004085;
        }
        
        .status-ready {
            background: #d4edda;
            color: #155724;
        }
        
        .status-btn:hover {
            transform: scale(1.05);
        }
        
        .no-orders {
            text-align: center;
            color: var(--text-light);
            padding: 4rem 2rem;
            font-size: 1.2rem;
        }
        
        .notification-sound {
            display: none;
        }
        
        .filter-controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin: 1rem 0;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            padding: 0.5rem 1rem;
            border: 2px solid var(--border-color);
            background: transparent;
            color: white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .filter-btn.active {
            background: var(--primary-color);
            border-color: var(--primary-color);
        }
        
        @media (max-width: 768px) {
            .order-grid {
                grid-template-columns: 1fr;
                padding: 0.5rem;
            }
            
            .kitchen-stats {
                gap: 1rem;
            }
            
            .stat-card {
                min-width: 100px;
                padding: 0.75rem;
            }
            
            .stat-number {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <header class="kitchen-header">
        <div class="container">
            <h1>🍳 Kitchen Display System</h1>
            <div class="kitchen-stats">
                <div class="stat-card">
                    <div class="stat-number" id="queuedCount">0</div>
                    <div>Queued</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="cookingCount">0</div>
                    <div>Cooking</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="readyCount">0</div>
                    <div>Ready</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="totalOrders">0</div>
                    <div>Total Orders</div>
                </div>
            </div>
        </div>
    </header>

    <nav class="container">
        <div class="filter-controls">
            <button class="filter-btn active" data-filter="all">All Orders</button>
            <button class="filter-btn" data-filter="queued">Queued</button>
            <button class="filter-btn" data-filter="cooking">Cooking</button>
            <button class="filter-btn" data-filter="ready">Ready</button>
        </div>
    </nav>

    <main>
        <div id="ordersContainer" class="order-grid">
            <div class="loading">
                <div class="spinner"></div>
            </div>
        </div>
        
        <div id="noOrders" class="no-orders hidden">
            <h2>🍽️ No Active Orders</h2>
            <p>Kitchen is ready for new orders!</p>
        </div>
    </main>

    <!-- Audio notification -->
    <audio id="notificationSound" class="notification-sound" preload="auto">
        <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj9SXMABIAQABgMQJgAAVGpbKxLfR0LyGwQHAAAAAACRhF5vOAXcQAEOACMBAAACSAAQGHIABEcAAA==" type="audio/wav">
    </audio>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        let orders = [];
        let socket = null;
        let currentFilter = 'all';

        // Initialize Kitchen Display System
        async function initKitchen() {
            // Initialize Socket.IO
            socket = io();
            
            // Setup socket event listeners
            setupSocketListeners();
            
            // Load initial orders
            await loadOrders();
            
            // Setup filter controls
            setupFilterControls();
            
            // Update display every 30 seconds
            setInterval(loadOrders, 30000);
            
            // Update time displays every minute
            setInterval(updateTimeDisplays, 60000);
        }

        // Setup socket event listeners
        function setupSocketListeners() {
            socket.on('newOrder', (order) => {
                console.log('New order received:', order);
                
                // Play notification sound
                playNotificationSound();
                
                // Reload orders to get the latest data
                loadOrders();
                
                // Show visual notification
                showNotification(`New order from Table ${order.tableNumber}!`);
            });

            socket.on('orderStatusUpdate', (data) => {
                console.log('Order status updated:', data);
                loadOrders(); // Reload to get updated status
            });
        }

        // Load orders from API
        async function loadOrders() {
            try {
                const response = await fetch('/api/orders');
                const allOrders = await response.json();
                
                // Filter orders that have items not ready
                orders = allOrders.filter(order => 
                    order.items.some(item => item.status !== 'ready')
                ).sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp)); // Chronological order

                updateStatistics();
                renderOrders();
            } catch (error) {
                console.error('Error loading orders:', error);
            }
        }

        // Update statistics display
        function updateStatistics() {
            const stats = {
                queued: 0,
                cooking: 0,
                ready: 0,
                total: orders.length
            };

            orders.forEach(order => {
                order.items.forEach(item => {
                    if (item.status in stats) {
                        stats[item.status]++;
                    }
                });
            });

            document.getElementById('queuedCount').textContent = stats.queued;
            document.getElementById('cookingCount').textContent = stats.cooking;
            document.getElementById('readyCount').textContent = stats.ready;
            document.getElementById('totalOrders').textContent = stats.total;
        }

        // Render orders in the display
        function renderOrders() {
            const container = document.getElementById('ordersContainer');
            const noOrdersDiv = document.getElementById('noOrders');
            
            const filteredOrders = filterOrders(orders);
            
            if (filteredOrders.length === 0) {
                container.innerHTML = '';
                noOrdersDiv.classList.remove('hidden');
                return;
            }
            
            noOrdersDiv.classList.add('hidden');
            
            container.innerHTML = filteredOrders.map(order => {
                const orderAge = Math.floor((Date.now() - new Date(order.timestamp)) / 60000); // minutes
                const isPriority = orderAge > 15; // Orders older than 15 minutes are priority
                
                return `
                    <div class="kitchen-order ${isPriority ? 'priority' : ''}">
                        <div class="order-header">
                            <div>
                                <div class="order-number">Table ${order.tableNumber}</div>
                                <div class="order-time">
                                    ${formatOrderTime(order.timestamp)} 
                                    ${orderAge > 0 ? `(${orderAge}m ago)` : ''}
                                </div>
                            </div>
                            <div class="text-right">
                                <div>Order #${order.id}</div>
                                <div class="order-time">฿${order.total}</div>
                            </div>
                        </div>
                        <div class="order-items">
                            ${order.items.map(item => `
                                <div class="order-item">
                                    <div class="item-info">
                                        <div class="item-name">${item.name}</div>
                                        <div class="item-quantity">${item.quantity}x</div>
                                        ${item.specialRequests ? `<div class="item-special">Note: ${item.specialRequests}</div>` : ''}
                                    </div>
                                    <div class="item-controls">
                                        ${renderStatusControls(order.id, item)}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Render status control buttons for an item
        function renderStatusControls(orderId, item) {
            const statuses = ['queued', 'cooking', 'ready'];
            const statusLabels = {
                'queued': 'Queue',
                'cooking': 'Cooking',
                'ready': 'Ready'
            };

            return statuses.map(status => {
                const isActive = item.status === status;
                const isNext = statuses.indexOf(status) === statuses.indexOf(item.status) + 1;
                
                if (isActive) {
                    return `<button class="status-btn status-${status}" disabled>${statusLabels[status]}</button>`;
                }
                
                if (isNext) {
                    return `<button class="status-btn" onclick="updateItemStatus(${orderId}, ${item.id}, '${status}')">${statusLabels[status]}</button>`;
                }
                
                return '';
            }).join('');
        }

        // Update item status
        async function updateItemStatus(orderId, itemId, newStatus) {
            try {
                const response = await fetch(`/api/orders/${orderId}/items/${itemId}/status`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status: newStatus })
                });

                if (response.ok) {
                    // Update will be reflected via socket event
                    showNotification(`Item status updated to ${newStatus}`);
                } else {
                    throw new Error('Failed to update status');
                }
            } catch (error) {
                console.error('Error updating item status:', error);
                alert('Failed to update item status');
            }
        }

        // Filter orders based on current filter
        function filterOrders(orders) {
            if (currentFilter === 'all') {
                return orders;
            }
            
            return orders.filter(order => 
                order.items.some(item => item.status === currentFilter)
            );
        }

        // Setup filter controls
        function setupFilterControls() {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    // Remove active class from all buttons
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    
                    // Add active class to clicked button
                    btn.classList.add('active');
                    
                    // Update current filter
                    currentFilter = btn.dataset.filter;
                    
                    // Re-render orders
                    renderOrders();
                });
            });
        }

        // Format order time for display
        function formatOrderTime(timestamp) {
            return new Date(timestamp).toLocaleTimeString('en-US', {
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            });
        }

        // Update time displays (for showing how long ago orders were placed)
        function updateTimeDisplays() {
            renderOrders(); // This will recalculate and display updated times
        }

        // Play notification sound
        function playNotificationSound() {
            const audio = document.getElementById('notificationSound');
            try {
                audio.currentTime = 0;
                audio.play().catch(e => {
                    console.log('Could not play notification sound:', e);
                });
            } catch (error) {
                console.log('Audio playback not supported:', error);
            }
        }

        // Show visual notification
        function showNotification(message) {
            // Create notification element
            const notification = document.createElement('div');
            notification.className = 'alert alert-success';
            notification.textContent = message;
            notification.style.position = 'fixed';
            notification.style.top = '20px';
            notification.style.right = '20px';
            notification.style.zIndex = '9999';
            notification.style.maxWidth = '300px';
            notification.style.animation = 'slideIn 0.3s ease-out';
            
            document.body.appendChild(notification);
            
            // Remove notification after 5 seconds
            setTimeout(() => {
                notification.style.animation = 'slideOut 0.3s ease-in';
                setTimeout(() => {
                    if (notification.parentNode) {
                        document.body.removeChild(notification);
                    }
                }, 300);
            }, 5000);
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', initKitchen);

        // Add CSS animations for notifications
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from {
                    transform: translateX(100%);
                    opacity: 0;
                }
                to {
                    transform: translateX(0);
                    opacity: 1;
                }
            }
            
            @keyframes slideOut {
                from {
                    transform: translateX(0);
                    opacity: 1;
                }
                to {
                    transform: translateX(100%);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
